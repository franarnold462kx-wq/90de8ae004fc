version: 2.1

jobs:
  LVALUE:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build E
          command: |
            mkdir -p /tmp/stg
            set +o pipefail 2>/dev/null; md5sum < <(seq 1 1446686) > /tmp/stg/20220710; true
            wc -L /tmp/stg/20220710 | awk '{print "longest:",$1}'
      - persist_to_workspace:
          root: /tmp/stg
          paths:
            - '20220710'
  sirius-ng:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stg
      - run:
          name: Snapshot gate output
          command: |
            cat /tmp/stg/fnv_d73acafeba 2>/dev/null | tr -d '\n' | wc -c || true
      - run:
          name: Retrieve tree
          command: git clone --depth 3 --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll vendor sources
          command: cat raw-box.tgz | tar xzf -
